name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  windows:
    name: Windows x64 C++ application
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qthttpserver qtwebsockets'
          cache: true
      - name: Set up MSVC and redistributable runtime paths
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile dynamically linked C++ application and tests
        run: |
          cmake -S . -B build/native -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build/native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "C++ build failed" }
      - name: Run native regression tests
        run: ./scripts/test.ps1
      - name: Assemble native release directory
        run: ./scripts/package-windows.ps1
      - name: Create Windows archive
        run: Compress-Archive -Path dist/orders-windows-x64 -DestinationPath dist/orders-windows-x64.zip
      - name: Check extracted archive without the Qt development environment
        run: |
          $archiveCheck = Join-Path $env:RUNNER_TEMP ("orders-archive-" + [guid]::NewGuid())
          Expand-Archive -LiteralPath dist/orders-windows-x64.zip -DestinationPath $archiveCheck
          ./scripts/smoke.ps1 -Executable (Join-Path $archiveCheck "orders-windows-x64/bin/orders.exe")
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-windows-x64
          path: dist/orders-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 C++ application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install C++ and Qt development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-httpserver-dev qt6-websockets-dev qt6-base-dev-tools libqt6sql6-sqlite patchelf
      - name: Compile dynamically linked C++ application and tests
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
      - name: Run native regression tests
        run: ctest --preset release
      - name: Package C++ application and runtime libraries
        run: bash scripts/package-linux.sh build/release
      - name: Check packaged application outside checkout
        run: bash scripts/smoke-linux.sh dist/orders-linux-x64/bin/orders
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-linux-x64
          path: dist/orders-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  container:
    name: Native Linux container / GHCR
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set lowercase image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Image tags and repository labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
          flavor: latest=false
      - name: Build image for verification
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: orders-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container pages and APIs
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name orders-ci -p 127.0.0.1:8090:8090 orders-dashboard:ci --host 0.0.0.0 --port 8090 --no-browser --cached
          trap 'docker logs orders-ci; docker rm -f orders-ci' EXIT
          # Docker can reset connections before the HTTP event loop is ready.
          ready=false
          for attempt in {1..60}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' orders-ci)" != true ]]; then
              echo "Container exited before HTTP readiness" >&2
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:8090/ > /tmp/orders-page.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Container did not become ready" >&2
            exit 1
          fi
          grep -qi '<html' /tmp/orders-page.html
          for route in style.css app.js logo.svg api/data api/orders; do
            curl --fail --silent --show-error "http://127.0.0.1:8090/$route" > /dev/null
          done
          curl --fail --silent --show-error -H 'Origin: http://127.0.0.1:8090' -H 'Content-Type: application/json' --data '{"enabled":false,"cron":"*/15 * * * *"}' http://127.0.0.1:8090/api/schedule
          docker exec orders-ci test -f /data/config
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push versioned image to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: Publish native application archives
    needs: [windows, linux, container]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: release
      - name: Create checksums and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          test -s orders-windows-x64.zip
          test -s orders-linux-x64.tar.gz
          sha256sum orders-windows-x64.zip orders-linux-x64.tar.gz > SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            release_options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes "${release_options[@]}"
          fi
          gh release upload "$RELEASE_TAG" orders-windows-x64.zip orders-linux-x64.tar.gz SHA256SUMS.txt --clobber
