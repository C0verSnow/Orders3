name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a verified prerelease for this exact branch SHA
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  publication:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.version.outputs.enabled }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      file_version: ${{ steps.version.outputs.file_version }}
    steps:
      - name: Select a traceable version
        id: version
        env:
          PREVIEW: ${{ inputs.publish_preview }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version="1.0.0+build.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          file_version="1.0.0-build.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          enabled=false
          prerelease=true
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            file_version="${tag#v}"
            version="${tag#v}"
            version="${version/-/\~}"
            enabled=true
            [[ "$tag" == *-* ]] || prerelease=false
          elif [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" || "$PREVIEW" == true ]]; then
            enabled=true
          fi
          printf 'enabled=%s\ntag=%s\nversion=%s\nprerelease=%s\nfile_version=%s\n' "$enabled" "$tag" "$version" "$prerelease" "$file_version" >> "$GITHUB_OUTPUT"

  checks:
    name: Business, security, types and React build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24.22.0', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: Existing host deployment script regressions
        run: |
          bash -n start-docker.sh scripts/deploy-ssh.sh scripts/start-docker.sh scripts/package-deb.sh
          python3 tests/scripts/deploy_ssh_test.py
          python3 tests/scripts/start_docker_test.py
          python3 tests/scripts/publication_test.py
      - run: npm run build
        env:
          ORDERS_VERSION: ci-${{ github.run_id }}
          ORDERS_COMMIT: ${{ github.sha }}
      - run: node scripts/smoke-runtime.mjs
      - name: Browser checks at desktop, tablet and phone sizes
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          node scripts/check-browser.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: tests/artifacts/
          if-no-files-found: ignore

  packages:
    name: Package and run ${{ matrix.os }} ${{ matrix.arch }}
    needs: [publication]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-2022
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ORDERS_VERSION: ${{ needs.publication.outputs.tag }}
      ORDERS_COMMIT: ${{ github.sha }}
      FILE_VERSION: ${{ needs.publication.outputs.file_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24.22.0', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Locate Windows SDK signature tool
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK signtool not found' }
          "SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV
      - run: npm run package:exe
      - name: Run the standalone Windows exe outside checkout
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "orders-windows-x64_v-$($env:FILE_VERSION).exe"
          Copy-Item dist/orders-win32-x64.exe $target
          node scripts/smoke-runtime.mjs $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item $target dist/release/
      - name: Build, install and run the actual Debian package
        if: matrix.os == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.publication.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/package-deb.sh "$ARCH" "$VERSION"
          mkdir -p dist/release
          asset="dist/release/orders3_v-${FILE_VERSION}_${ARCH}.deb"
          cp "dist/orders3_${VERSION}_${ARCH}.deb" "$asset"
          sudo dpkg -i "$asset"
          node scripts/smoke-runtime.mjs /usr/bin/orders3
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: orders-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  container-build:
    name: Native ${{ matrix.arch }} container
    needs: [checks, packages, publication]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - name: Lowercase registry name
        id: image
        env: { REPOSITORY: '${{ github.repository }}' }
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: orders-dashboard:ci
          build-args: |
            APP_VERSION=${{ needs.publication.outputs.tag }}
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.publication.outputs.tag }}
          cache-from: type=gha,scope=node-container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=node-container-${{ matrix.arch }}
      - name: Verify actual native container and random-port host script
        env: { EXPECTED_ARCH: '${{ matrix.arch }}' }
        run: |
          set -euo pipefail
          test "$(docker image inspect orders-dashboard:ci --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          docker run -d --name orders-ci -p 127.0.0.1:8090:8090 -e ORDERS_ACCESS_TOKEN=ci-container-token-with-at-least-32-chars orders-dashboard:ci --cached
          trap 'docker logs orders-ci; docker rm -f orders-ci' EXIT
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:8090/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8090/health
          curl -fsS http://127.0.0.1:8090/ | grep -q '<html'
          curl -fsS -H 'Authorization: Bearer ci-container-token-with-at-least-32-chars' http://127.0.0.1:8090/api/data
          docker rm -f orders-ci
          trap - EXIT
          export ORDERS_IMAGE=orders-dashboard:ci ORDERS_PULL_POLICY=never ORDERS_CONTAINER_NAME=orders-ci-random
          trap 'docker logs orders-ci-random; docker rm -f orders-ci-random' EXIT
          bash start-docker.sh --cached
          test -s docker.md
      - uses: docker/login-action@v4.6.0
        if: needs.publication.outputs.enabled == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        id: push
        if: needs.publication.outputs.enabled == 'true'
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ needs.publication.outputs.tag }}
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=node-container-${{ matrix.arch }}
      - name: Export native digest
        if: needs.publication.outputs.enabled == 'true'
        env: { DIGEST: '${{ steps.push.outputs.digest }}' }
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.1
        if: needs.publication.outputs.enabled == 'true'
        with:
          name: container-digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  container:
    needs: [publication, container-build]
    if: needs.publication.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - id: image
        env: { REPOSITORY: '${{ github.repository }}' }
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: actions/download-artifact@v8.0.1
        with: { pattern: container-digests-*, path: digests, merge-multiple: true }
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.publication.outputs.tag }}
          PRERELEASE: ${{ needs.publication.outputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sources=()
          for digest in digests/*; do
            hash="${digest##*/}"
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$hash")
          done
          test "${#sources[@]}" -eq 2
          tags=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" || "$PRERELEASE" == false ]]; then tags+=(--tag "$IMAGE:latest"); fi
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then tags+=(--tag "$IMAGE:$DEFAULT_BRANCH"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" --raw | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64","arm64"]'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  release:
    needs: [publication, checks, packages, container]
    if: needs.publication.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8.0.1
        with: { pattern: orders-*, path: release, merge-multiple: true }
      - name: Publish verified artifacts for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publication.outputs.tag }}
          FILE_VERSION: ${{ needs.publication.outputs.file_version }}
          PRERELEASE: ${{ needs.publication.outputs.prerelease }}
          IMAGE: ${{ needs.container.outputs.image }}
          DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          cd release
          [[ "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          binaries=("orders-windows-x64_v-${FILE_VERSION}.exe" "orders3_v-${FILE_VERSION}_amd64.deb" "orders3_v-${FILE_VERSION}_arm64.deb")
          for asset in "${binaries[@]}"; do test -s "$asset"; done
          image_file="container-image_v-${FILE_VERSION}.txt"
          sums_file="SHA256SUMS_v-${FILE_VERSION}.txt"
          printf '%s\n%s\ncommit=%s\n' "$IMAGE:$TAG" "$IMAGE@$DIGEST" "$GITHUB_SHA" > "$image_file"
          sha256sum "${binaries[@]}" "$image_file" > "$sums_file"
          sha256sum -c "$sums_file"
          printf 'Source commit: `%s`\n\nContainer: `%s@%s`\n\nArtifacts were installed/started on native Windows x64, Linux AMD64 and Linux ARM64 CI runners.\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" > notes.md
          options=(--target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md)
          if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease --latest=false); fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then gh release create "$TAG" "${options[@]}"; fi
          gh release upload "$TAG" "${binaries[@]}" "$image_file" "$sums_file" --clobber

  deploy:
    name: Deploy default branch over Tailscale and SSH
    needs: [container, release]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.AUTH_KEY }}
          ping: ${{ secrets.DEPLOY_HOST }}
      - name: Upload host script and deploy the verified image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ORDERS_IMAGE: ${{ needs.container.outputs.image }}@${{ needs.container.outputs.digest }}
        run: bash scripts/deploy-ssh.sh
