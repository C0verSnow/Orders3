name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  windows:
    name: Windows x64 executable
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and packaging dependencies
        run: python -m pip install ".[desktop]" "pyinstaller>=6.22,<7"
      - name: Run regression tests
        run: python scripts/test.py
      - name: Check C++ launcher with dynamic MSVC runtime
        run: |
          cmake -S . -B build/native -A x64 -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          cmake --build build/native --config Release
      - name: Package single executable with dynamic system libraries
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --noupx
          --name orders-windows-x64 --paths src
          --collect-data orders_dashboard --collect-all webview
          --hidden-import orders_dashboard.desktop scripts/standalone.py
      - name: Verify executable outside source checkout
        run: python scripts/smoke_standalone.py dist/orders-windows-x64.exe
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: executable-windows-x64
          path: dist/orders-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 executable
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and packaging dependencies
        run: python -m pip install . 'pyinstaller>=6.22,<7'
      - name: Run regression tests
        run: python scripts/test.py
      - name: Check C++ launcher with dynamic system libraries
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 2
      - name: Package single executable with dynamic system libraries
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --noupx
          --name orders-linux-x64 --paths src
          --collect-data orders_dashboard scripts/standalone.py
      - name: Verify executable outside source checkout
        run: python scripts/smoke_standalone.py dist/orders-linux-x64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: executable-linux-x64
          path: dist/orders-linux-x64
          if-no-files-found: error
          retention-days: 14

  container:
    name: Linux container image / GHCR
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set lowercase image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Image tags and repository labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha
          flavor: latest=false
      - name: Build image for verification
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: orders-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container pages and APIs
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name orders-ci -p 127.0.0.1:8090:8090 orders-dashboard:ci --host 0.0.0.0 --port 8090 --no-browser --cached
          trap 'docker logs orders-ci; docker rm -f orders-ci' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8090/ > /tmp/orders-page.html
          grep -qi '<html' /tmp/orders-page.html
          for route in style.css app.js logo.svg api/data api/orders; do
            curl --fail --silent --show-error "http://127.0.0.1:8090/$route" > /dev/null
          done
          curl --fail --silent --show-error -H 'Origin: http://127.0.0.1:8090' -H 'Content-Type: application/json' --data '{"enabled":false,"cron":"*/15 * * * *"}' http://127.0.0.1:8090/api/schedule
          docker exec orders-ci test -f /data/config
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push versioned image to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: Publish Windows and Linux executables
    needs: [windows, linux, container]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: executable-*
          merge-multiple: true
          path: release
      - name: Create checksums and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          test -s orders-windows-x64.exe
          test -s orders-linux-x64
          sha256sum orders-windows-x64.exe orders-linux-x64 > SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            release_options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes "${release_options[@]}"
          fi
          gh release upload "$RELEASE_TAG" orders-windows-x64.exe orders-linux-x64 SHA256SUMS.txt --clobber
