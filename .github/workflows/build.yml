name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  web:
    name: Web static checks and state regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment shell syntax
        run: |
          for script in scripts/deploy-ssh.sh scripts/start-docker.sh start-docker.sh; do
            bash -n "$script"
          done
      - name: Check SSH script upload and execution
        run: python3 tests/scripts/deploy_ssh_test.py
      - name: Check dashboard address recording
        run: python3 tests/scripts/start_docker_test.py
      - run: npm run check
      - run: npm test

  publication:
    name: Determine publication version
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.version.outputs.enabled }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Select release and image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF#refs/tags/}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/master ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "tag=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows x64 C++ application
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qthttpserver qtwebsockets'
          cache: true
      - name: Set up MSVC and redistributable runtime paths
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile dynamically linked C++ application and tests
        run: |
          cmake -S . -B build/native -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build/native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "C++ build failed" }
      - name: Run native regression tests
        run: ./scripts/test.ps1
      - name: Assemble native release directory
        run: ./scripts/package-windows.ps1 -PackageDirectory dist/windows-artifact/orders-windows-x64
      - name: Create Windows archive
        run: Compress-Archive -Path dist/windows-artifact/orders-windows-x64 -DestinationPath dist/orders-windows-x64.zip
      - name: Check extracted archive without the Qt development environment
        run: |
          $archiveCheck = Join-Path $env:RUNNER_TEMP ("orders-archive-" + [guid]::NewGuid())
          Expand-Archive -LiteralPath dist/orders-windows-x64.zip -DestinationPath $archiveCheck
          ./scripts/smoke.ps1 -Executable (Join-Path $archiveCheck "orders-windows-x64/orders.exe")
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: orders-windows-x64
          path: dist/windows-artifact
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} C++ application
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install C++ and Qt development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-httpserver-dev qt6-websockets-dev qt6-base-dev-tools libqt6sql6-sqlite patchelf
      - name: Compile dynamically linked C++ application and tests
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
      - name: Run native regression tests
        run: ctest --preset release
      - name: Package C++ application and runtime libraries
        run: bash scripts/package-linux.sh build/release dist/orders-linux-${{ matrix.arch }}
      - name: Check packaged application outside checkout
        run: bash scripts/smoke-linux.sh dist/orders-linux-${{ matrix.arch }}/bin/orders
      - name: Stage Linux artifact without a nested archive
        run: |
          mkdir -p dist/linux-artifact
          cp -a dist/orders-linux-${{ matrix.arch }} dist/linux-artifact/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: orders-linux-${{ matrix.arch }}
          path: dist/linux-artifact
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} C++ application
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            cmake_arch: x86_64
          - arch: arm64
            runner: macos-15
            cmake_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          modules: 'qthttpserver qtwebsockets'
          cache: true
      - name: Install build tools
        run: brew install ninja
      - name: Compile dynamically linked C++ application and tests
        run: |
          cmake --preset release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build --preset release --parallel 3
      - name: Run native regression tests
        run: ctest --preset release
      - name: Package application bundle and runtime libraries
        run: |
          package_directory=dist/macos-artifact/orders-macos-${{ matrix.arch }}
          cmake --install build/release --prefix "$package_directory"
          test -f "$package_directory/orders.app/Contents/PlugIns/sqldrivers/libqsqlite.dylib"
          test -f "$package_directory/orders.app/Contents/Frameworks/liborders_core.dylib"
          cp README.md docs/architecture.md docs/third-party.md "$package_directory/"
          codesign --force --deep --sign - "$package_directory/orders.app"
      - name: Check packaged application outside checkout without Qt development paths
        run: |
          temporary="$(mktemp -d)"
          cp -R dist/macos-artifact/orders-macos-${{ matrix.arch }}/orders.app "$temporary/"
          unset QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH QTDIR QT_ROOT_DIR DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH
          bash scripts/smoke-linux.sh "$temporary/orders.app/Contents/MacOS/orders"
      - name: Archive macOS package preserving executable permissions
        run: |
          tar -C dist/macos-artifact -czf dist/orders-macos-${{ matrix.arch }}.tar.gz orders-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: orders-macos-${{ matrix.arch }}
          path: dist/orders-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  container-build:
    name: Native Linux ${{ matrix.arch }} container
    needs: [web, publication, windows, linux, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            host_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            host_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner and Docker architecture
        shell: bash
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(docker info --format '{{.Architecture}}')" = "$EXPECTED_HOST_ARCH"
      - name: Set lowercase image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Repository image labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
      - name: Build native image for verification
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: orders-dashboard:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Verify built image architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(docker image inspect orders-dashboard:ci --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
      - name: Verify container pages and APIs
        shell: bash
        run: |
          set -euo pipefail
          verify_container() {
            local platform="$1" image="$2" mode="$3"
            if [[ "$mode" == manual ]]; then
              # Exercise the user's exact command from the image's default working directory.
              docker run -d --platform "$platform" --name orders-ci -p 127.0.0.1:8090:8090 --entrypoint /bin/sh "$image" -c 'exec ./orders'
            elif [[ "$mode" == manual-without-env ]]; then
              # Verify native container defaults without Dockerfile-provided values.
              docker run -d --platform "$platform" --name orders-ci -p 127.0.0.1:8090:8090 --entrypoint /bin/sh "$image" -c 'unset ORDERS_HOST ORDERS_PORT ORDERS_NO_BROWSER; exec ./orders'
            else
              docker run -d --platform "$platform" --name orders-ci -p 127.0.0.1:8090:8090 "$image"
            fi
            trap 'docker logs orders-ci; docker rm -f orders-ci' EXIT
            # Docker can reset connections before the HTTP event loop is ready.
            ready=false
            for attempt in {1..60}; do
              if [[ "$(docker inspect --format '{{.State.Running}}' orders-ci)" != true ]]; then
                echo "Container exited before HTTP readiness" >&2
                exit 1
              fi
              if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:8090/ > /tmp/orders-page.html; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then
              echo "Container did not become ready" >&2
              exit 1
            fi
            grep -qi '<html' /tmp/orders-page.html
            docker logs orders-ci > /tmp/orders-container.log 2>&1
            grep -Fq '本地看板：http://127.0.0.1:8090/' /tmp/orders-container.log
            for route in style.css flow.css app.js activity.js flow.js logo.svg api/data api/orders api/activity; do
              curl --fail --silent --show-error "http://127.0.0.1:8090/$route" > /dev/null
            done
            curl --fail --silent --show-error -H 'Origin: http://127.0.0.1:8090' -H 'Content-Type: application/json' --data '{"enabled":false,"cron":"*/15 * * * *"}' http://127.0.0.1:8090/api/schedule
            docker exec orders-ci test -f /data/config
            docker logs orders-ci
            docker rm -f orders-ci
            trap - EXIT
          }
          verify_container "${{ matrix.platform }}" orders-dashboard:ci automatic
          verify_container "${{ matrix.platform }}" orders-dashboard:ci manual
          verify_container "${{ matrix.platform }}" orders-dashboard:ci manual-without-env
      - name: Verify automatic random port mapping
        shell: bash
        run: |
          set -euo pipefail
          export ORDERS_IMAGE=orders-dashboard:ci
          export ORDERS_PULL_POLICY=never
          export ORDERS_CONTAINER_NAME=orders-ci-random
          trap 'docker logs orders-ci-random; docker rm -f orders-ci-random' EXIT
          bash start-docker.sh --cached > /tmp/orders-random.log
          cat /tmp/orders-random.log
          url="$(sed -n 's/^本地看板：//p' /tmp/orders-random.log)"
          port="$(docker exec orders-ci-random printenv ORDERS_PORT)"
          test "$url" = "http://127.0.0.1:$port/"
          printf '本地看板：\n127.0.0.1:%s\n' "$port" > /tmp/orders-expected-docker.md
          cmp /tmp/orders-expected-docker.md docker.md
          test "$(docker port orders-ci-random "$port/tcp")" = "127.0.0.1:$port"
          curl --fail --silent --show-error "${url}api/data" > /dev/null
          curl --fail --silent --show-error -H "Origin: ${url%/}" -H 'Content-Type: application/json' --data '{"enabled":false,"cron":"*/15 * * * *"}' "${url}api/schedule"
      - name: Log in to GHCR
        if: needs.publication.outputs.enabled == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified native image by digest
        id: push
        if: needs.publication.outputs.enabled == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=container-${{ matrix.arch }}
      - name: Export image digest
        if: needs.publication.outputs.enabled == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.1
        if: needs.publication.outputs.enabled == 'true'
        with:
          name: container-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  container:
    name: Assemble multi-platform container / GHCR
    needs: [publication, container-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Set lowercase image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
        if: needs.publication.outputs.enabled == 'true'
      - name: Image tags and repository labels
        id: meta
        if: needs.publication.outputs.enabled == 'true'
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.publication.outputs.tag }},enable=${{ needs.publication.outputs.enabled == 'true' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ needs.publication.outputs.enabled == 'true' && (github.ref == 'refs/heads/master' || needs.publication.outputs.prerelease == 'false') }}
            type=sha
          flavor: latest=false
      - name: Download native image digests
        if: needs.publication.outputs.enabled == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: container-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to GHCR
        if: needs.publication.outputs.enabled == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify multi-platform manifest
        id: manifest
        if: needs.publication.outputs.enabled == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.publication.outputs.tag }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          tag_args=()
          while IFS= read -r tag; do
            test -n "$tag"
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy master over Tailscale and SSH
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate deployment settings
        shell: bash
        env:
          AUTH_KEY: ${{ secrets.AUTH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          for name in AUTH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY IMAGE_DIGEST; do
            if [[ -z "${!name}" ]]; then
              echo "Missing deployment setting: $name" >&2
              exit 1
            fi
          done
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.AUTH_KEY }}
          ping: ${{ secrets.DEPLOY_HOST }}
      - name: Upload start-docker.sh and run remote service
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ORDERS_IMAGE: ${{ needs.container.outputs.image }}:latest
        run: bash scripts/deploy-ssh.sh

  release:
    name: Publish native application archives
    needs: [web, publication, windows, linux, macos, container]
    if: needs.publication.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: orders-*
          merge-multiple: false
          path: release
      - name: Create checksums and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publication.outputs.tag }}
          PRERELEASE: ${{ needs.publication.outputs.prerelease }}
          IMAGE_NAME: ${{ needs.container.outputs.image }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          cd release
          cd orders-windows-x64
          zip -r ../orders-windows-x64.zip orders-windows-x64
          cd ..
          for arch in x64 arm64; do
            chmod +x "orders-linux-$arch/orders-linux-$arch/bin/orders"
            tar -C "orders-linux-$arch" -czf "orders-linux-$arch.tar.gz" "orders-linux-$arch"
            mv "orders-macos-$arch/orders-macos-$arch.tar.gz" .
            test -s "orders-linux-$arch.tar.gz"
            test -s "orders-macos-$arch.tar.gz"
          done
          test -s orders-windows-x64.zip
          test -s orders-linux-x64.tar.gz
          test -n "$IMAGE_DIGEST"
          printf '%s\n' "$IMAGE_NAME:$RELEASE_TAG" "$IMAGE_NAME@$IMAGE_DIGEST" > container-image.txt
          printf 'Container image: `%s:%s`\n\nPull this exact image:\n```sh\ndocker pull %s@%s\n```\n' "$IMAGE_NAME" "$RELEASE_TAG" "$IMAGE_NAME" "$IMAGE_DIGEST" > release-notes.md
          sha256sum orders-windows-x64.zip orders-linux-*.tar.gz orders-macos-*.tar.gz container-image.txt > SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            release_options=()
            if [[ "$PRERELEASE" == true ]]; then
              release_options+=(--prerelease --latest=false)
            fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              release_options+=(--verify-tag)
            else
              release_options+=(--target "$GITHUB_SHA")
            fi
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --notes-file release-notes.md "${release_options[@]}"
          fi
          gh release upload "$RELEASE_TAG" orders-windows-x64.zip orders-linux-*.tar.gz orders-macos-*.tar.gz container-image.txt SHA256SUMS.txt --clobber
